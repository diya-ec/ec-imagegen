services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecimagegen
      POSTGRES_PASSWORD: ecimagegen
      POSTGRES_DB: ecimagegen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ecimagegen:ecimagegen@postgres:5432/ecimagegen
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ecimagegen:ecimagegen@postgres:5432/ecimagegen
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
